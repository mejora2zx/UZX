<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administrar Exámenes - Zubex</title>
<style>
  :root {
    --azul: #0D18A8;
    --azul-oscuro: #090F73;
    --naranja: #FF4E00;
    --morado: #9631F7;
    --bg: #F5F6FA;
    --card: #FFFFFF;
    --text: #1A1D29;
    --muted: #6B7080;
    --ok: #1D9E75;
    --err: #D85A30;
    --borde: #E3E5EE;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  header {
    background: var(--azul);
    color: white;
    padding: 18px 24px;
  }
  header .titulo { font-size: 1.1rem; font-weight: 600; }
  header .aviso { font-size: 0.8rem; opacity: 0.85; margin-top: 2px; }
  main { max-width: 780px; margin: 0 auto; padding: 24px; }
  h2 { font-size: 1.1rem; margin: 28px 0 12px; }
  .card {
    background: var(--card);
    border-radius: 10px;
    padding: 22px;
    border: 1px solid var(--borde);
    margin-bottom: 16px;
  }
  label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.9rem; }
  input[type="text"], input[type="number"], select {
    width: 100%;
    padding: 10px;
    border-radius: 6px;
    border: 1px solid var(--borde);
    font-size: 1rem;
    margin-bottom: 16px;
    font-family: inherit;
  }
  .fila-2 { display: grid; grid-template-columns: 2fr 1fr; gap: 14px; }

  .pregunta-item {
    border: 1px solid var(--borde);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 14px;
    background: #FAFAFC;
  }
  .pregunta-item .encabezado {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .pregunta-item .encabezado span { font-weight: 600; color: var(--azul); }
  .opcion-fila { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .opcion-fila input[type="text"] { margin-bottom: 0; flex: 1; }
  .opcion-fila input[type="radio"] { width: 18px; height: 18px; flex-shrink: 0; }
  .btn-quitar {
    background: none;
    border: none;
    color: var(--err);
    cursor: pointer;
    font-size: 0.85rem;
    text-decoration: underline;
  }
  .btn-secundario {
    background: white;
    border: 1px solid var(--azul);
    color: var(--azul);
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.9rem;
    margin-right: 8px;
  }
  .btn-secundario:hover { background: #EEF0FC; }
  button.primario {
    background: var(--azul);
    color: white;
    border: none;
    padding: 12px 22px;
    border-radius: 6px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }
  button.primario:hover { background: var(--azul-oscuro); }
  button.primario:disabled { opacity: 0.5; cursor: not-allowed; }

  .status { margin-top: 12px; padding: 10px; border-radius: 6px; display: none; font-size: 0.9rem; }
  .status.ok { display: block; background: rgba(29,158,117,0.12); color: var(--ok); }
  .status.err { display: block; background: rgba(216,90,48,0.12); color: var(--err); }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--borde); font-size: 0.9rem; }
  th { color: var(--muted); font-weight: 600; font-size: 0.8rem; text-transform: none; }
  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 0.78rem;
    font-weight: 600;
  }
  .badge.activo { background: rgba(29,158,117,0.12); color: var(--ok); }
  .badge.inactivo { background: rgba(107,112,128,0.12); color: var(--muted); }
  .link-accion {
    background: none;
    border: none;
    color: var(--azul);
    cursor: pointer;
    font-size: 0.85rem;
    text-decoration: underline;
    padding: 0;
    margin-right: 10px;
  }
  .link-accion.err { color: var(--err); }
  .vacio { color: var(--muted); text-align: center; padding: 30px 0; }
</style>
</head>
<body>

<header>
  <div class="titulo">Administrar exámenes · Zubex</div>
  <div class="aviso">Solo para uso interno de Mejora Continua — este link no debe compartirse con operadores.</div>
</header>

<main>

  <h2>Nuevo examen</h2>
  <div class="card">
    <div class="fila-2">
      <div>
        <label for="input-titulo">Título del examen</label>
        <input type="text" id="input-titulo" placeholder="Ej. Reglamento interno de trabajo">
      </div>
      <div>
        <label for="input-umbral">% mínimo para aprobar</label>
        <input type="number" id="input-umbral" value="80" min="1" max="100">
      </div>
    </div>

    <label for="input-categoria">Categoría</label>
    <select id="input-categoria">
      <option>Institucionales</option>
      <option>Extrusión</option>
      <option>Impresión</option>
      <option>Conversión</option>
      <option>Corrugado</option>
    </select>

    <div id="preguntas-contenedor"></div>

    <button class="btn-secundario" id="btn-agregar-pregunta" type="button">+ Agregar pregunta</button>

    <div style="margin-top:20px;">
      <button class="primario" id="btn-guardar-examen">Guardar examen</button>
    </div>
    <div class="status" id="status-guardar"></div>
  </div>

  <h2>Exámenes existentes</h2>
  <div class="card">
    <table id="tabla-examenes">
      <thead>
        <tr><th>Título</th><th>Categoría</th><th>Preguntas</th><th>Estado</th><th></th></tr>
      </thead>
      <tbody id="tabla-examenes-body">
        <tr><td colspan="5" class="vacio">Cargando...</td></tr>
      </tbody>
    </table>
  </div>

</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBZu-ig-1mxHYASJd4yAhmUUGZ_JHuwn8w",
    authDomain: "universidad-zubex.firebaseapp.com",
    databaseURL: "https://universidad-zubex-default-rtdb.firebaseio.com",
    projectId: "universidad-zubex",
    storageBucket: "universidad-zubex.firebasestorage.app",
    messagingSenderId: "827526548281",
    appId: "1:827526548281:web:f48223eadd0bfaf0f1b6e8"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  let contadorPreguntas = 0;
  const contenedor = document.getElementById("preguntas-contenedor");

  // ======= Agregar un bloque de pregunta al formulario =======
  function agregarBloquePregunta() {
    contadorPreguntas++;
    const id = contadorPreguntas;
    const div = document.createElement("div");
    div.className = "pregunta-item";
    div.dataset.id = id;
    div.innerHTML = `
      <div class="encabezado">
        <span>Pregunta ${id}</span>
        <button type="button" class="btn-quitar" onclick="quitarPregunta(${id})">Quitar</button>
      </div>
      <input type="text" class="pregunta-texto" placeholder="Escribe la pregunta">
      <div class="opciones-lista"></div>
      <button type="button" class="link-accion" onclick="agregarOpcion(${id})">+ Agregar opción</button>
    `;
    contenedor.appendChild(div);
    // Toda pregunta empieza con 2 opciones
    agregarOpcion(id);
    agregarOpcion(id);
  }

  function quitarPregunta(id) {
    const bloque = contenedor.querySelector(`.pregunta-item[data-id="${id}"]`);
    if (bloque) bloque.remove();
  }

  function agregarOpcion(preguntaId) {
    const bloque = contenedor.querySelector(`.pregunta-item[data-id="${preguntaId}"]`);
    const lista = bloque.querySelector(".opciones-lista");
    const opcionId = lista.children.length;
    const fila = document.createElement("div");
    fila.className = "opcion-fila";
    fila.innerHTML = `
      <input type="radio" name="correcta-${preguntaId}" title="Marcar como respuesta correcta" value="${opcionId}">
      <input type="text" class="opcion-texto" placeholder="Opción de respuesta">
      <button type="button" class="btn-quitar" onclick="this.parentElement.remove()">Quitar</button>
    `;
    lista.appendChild(fila);
  }

  document.getElementById("btn-agregar-pregunta").addEventListener("click", agregarBloquePregunta);
  // Arrancamos con una pregunta ya visible
  agregarBloquePregunta();

  // ======= Guardar el examen completo en Firestore =======
  document.getElementById("btn-guardar-examen").addEventListener("click", async () => {
    const status = document.getElementById("status-guardar");
    const btn = document.getElementById("btn-guardar-examen");
    const titulo = document.getElementById("input-titulo").value.trim();
    const categoria = document.getElementById("input-categoria").value;
    const umbral = parseInt(document.getElementById("input-umbral").value) || 80;

    const bloques = contenedor.querySelectorAll(".pregunta-item");
    if (!titulo || bloques.length === 0) {
      status.className = "status err";
      status.textContent = "Ponle un título al examen y agrega al menos una pregunta.";
      return;
    }

    const preguntas = [];
    for (const bloque of bloques) {
      const texto = bloque.querySelector(".pregunta-texto").value.trim();
      const filasOpciones = bloque.querySelectorAll(".opcion-fila");
      const opciones = [];
      let respuestaCorrecta = null;

      filasOpciones.forEach((fila, idx) => {
        const textoOpcion = fila.querySelector(".opcion-texto").value.trim();
        const radio = fila.querySelector('input[type="radio"]');
        if (textoOpcion) {
          opciones.push(textoOpcion);
          if (radio.checked) respuestaCorrecta = opciones.length - 1;
        }
      });

      if (!texto || opciones.length < 2 || respuestaCorrecta === null) {
        status.className = "status err";
        status.textContent = `Revisa la pregunta "${texto || "(sin texto)"}": necesita texto, al menos 2 opciones y una marcada como correcta.`;
        return;
      }
      preguntas.push({ texto, opciones, respuestaCorrecta });
    }

    if (preguntas.length !== bloques.length) return; // hubo un error de validación arriba

    btn.disabled = true;
    btn.textContent = "Guardando...";

    try {
      await db.collection("examenes").add({
        titulo,
        categoria,
        umbralAprobacion: umbral,
        activo: true,
        preguntas,
        creado: firebase.firestore.FieldValue.serverTimestamp()
      });
      status.className = "status ok";
      status.textContent = "Examen guardado correctamente.";
      // Limpiamos el formulario para capturar el siguiente examen
      document.getElementById("input-titulo").value = "";
      document.getElementById("input-umbral").value = 80;
      contenedor.innerHTML = "";
      contadorPreguntas = 0;
      agregarBloquePregunta();
      cargarTablaExamenes();
    } catch (error) {
      status.className = "status err";
      status.textContent = "Error al guardar: " + error.message;
    } finally {
      btn.disabled = false;
      btn.textContent = "Guardar examen";
    }
  });

  // ======= Listar exámenes existentes con acciones =======
  async function cargarTablaExamenes() {
    const tbody = document.getElementById("tabla-examenes-body");
    tbody.innerHTML = `<tr><td colspan="5" class="vacio">Cargando...</td></tr>`;

    const snapshot = await db.collection("examenes").orderBy("creado", "desc").get();

    if (snapshot.empty) {
      tbody.innerHTML = `<tr><td colspan="5" class="vacio">Todavía no hay exámenes creados.</td></tr>`;
      return;
    }

    tbody.innerHTML = "";
    snapshot.forEach(doc => {
      const data = doc.data();
      const tr = document.createElement("tr");
      const link = `${window.location.origin}${window.location.pathname.replace("admin-examenes.html", "")}?examen=${doc.id}`;
      tr.innerHTML = `
        <td>${data.titulo}</td>
        <td>${data.categoria}</td>
        <td>${data.preguntas.length}</td>
        <td><span class="badge ${data.activo ? "activo" : "inactivo"}">${data.activo ? "Activo" : "Inactivo"}</span></td>
        <td>
          <button class="link-accion" data-accion="copiar" data-link="${link}">Copiar link</button>
          <button class="link-accion" data-accion="toggle" data-id="${doc.id}" data-activo="${data.activo}">${data.activo ? "Desactivar" : "Activar"}</button>
          <button class="link-accion err" data-accion="eliminar" data-id="${doc.id}">Eliminar</button>
        </td>
      `;
      tbody.appendChild(tr);
    });

    tbody.querySelectorAll("[data-accion='copiar']").forEach(b => {
      b.addEventListener("click", () => {
        navigator.clipboard.writeText(b.dataset.link);
        b.textContent = "¡Copiado!";
        setTimeout(() => (b.textContent = "Copiar link"), 1500);
      });
    });

    tbody.querySelectorAll("[data-accion='toggle']").forEach(b => {
      b.addEventListener("click", async () => {
        const nuevoEstado = b.dataset.activo !== "true";
        await db.collection("examenes").doc(b.dataset.id).update({ activo: nuevoEstado });
        cargarTablaExamenes();
      });
    });

    tbody.querySelectorAll("[data-accion='eliminar']").forEach(b => {
      b.addEventListener("click", async () => {
        if (confirm("¿Eliminar este examen? Esta acción no se puede deshacer.")) {
          await db.collection("examenes").doc(b.dataset.id).delete();
          cargarTablaExamenes();
        }
      });
    });
  }

  cargarTablaExamenes();
</script>
</body>
</html>
