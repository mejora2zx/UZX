<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Universidad Zubex</title>
<style>
  :root {
    --azul: #0D18A8;
    --azul-oscuro: #090F73;
    --naranja: #FF4E00;
    --morado: #9631F7;
    --bg: #F5F6FA;
    --card: #FFFFFF;
    --text: #1A1D29;
    --muted: #6B7080;
    --ok: #1D9E75;
    --err: #D85A30;
    --borde: #E3E5EE;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  header {
    background: var(--azul);
    color: white;
    padding: 18px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header .titulo { font-size: 1.1rem; font-weight: 600; }
  header .volver {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.4);
    color: white;
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.85rem;
  }
  header .volver:hover { background: rgba(255,255,255,0.1); }
  main { max-width: 720px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  .subtitle { color: var(--muted); margin-bottom: 20px; font-size: 0.95rem; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .cat-card, .exam-card {
    background: var(--card);
    border: 1px solid var(--borde);
    border-radius: 10px;
    padding: 18px;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .cat-card:hover, .exam-card:hover { border-color: var(--azul); }
  .cat-card .nombre { font-weight: 600; font-size: 1.05rem; color: var(--azul); }
  .cat-card .conteo { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }
  .exam-card .nombre { font-weight: 600; }
  .exam-card .meta { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }

  .card {
    background: var(--card);
    border-radius: 10px;
    padding: 22px;
    border: 1px solid var(--borde);
    margin-bottom: 16px;
  }
  label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.9rem; }
  input[type="text"] {
    width: 100%;
    padding: 10px;
    border-radius: 6px;
    border: 1px solid var(--borde);
    font-size: 1rem;
    margin-bottom: 16px;
  }
  .pregunta-bloque { margin-bottom: 22px; }
  .pregunta-texto { font-weight: 600; margin-bottom: 10px; }
  .opciones label {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border: 1px solid var(--borde);
    border-radius: 6px;
    margin-bottom: 8px;
    cursor: pointer;
    font-weight: 400;
  }
  .opciones label:hover { border-color: var(--azul); }

  button.primario {
    background: var(--azul);
    color: white;
    border: none;
    padding: 12px 22px;
    border-radius: 6px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }
  button.primario:hover { background: var(--azul-oscuro); }
  button.primario:disabled { opacity: 0.5; cursor: not-allowed; }

  .error-msg { color: var(--err); font-size: 0.85rem; margin-top: -8px; margin-bottom: 14px; }

  .resultado { text-align: center; padding: 30px 20px; }
  .resultado .puntaje { font-size: 2.4rem; font-weight: 700; margin: 10px 0; }
  .resultado .puntaje.aprobado { color: var(--ok); }
  .resultado .puntaje.reprobado { color: var(--err); }
  .resultado .estado { font-size: 1.1rem; font-weight: 600; margin-bottom: 6px; }
  .resultado .estado.aprobado { color: var(--ok); }
  .resultado .estado.reprobado { color: var(--err); }
  .resultado p.detalle { color: var(--muted); margin-bottom: 24px; }

  .vacio { color: var(--muted); text-align: center; padding: 40px 0; }
  .cargando { color: var(--muted); text-align: center; padding: 40px 0; }
</style>
</head>
<body>

<header>
  <span class="titulo">Universidad Zubex</span>
  <button class="volver" id="btn-volver" style="display:none;">← Menú principal</button>
</header>

<main id="app">
  <div class="cargando">Cargando...</div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
  // ======= CONFIGURACIÓN DE FIREBASE =======
  const firebaseConfig = {
    apiKey: "AIzaSyBZu-ig-1mxHYASJd4yAhmUUGZ_JHuwn8w",
    authDomain: "universidad-zubex.firebaseapp.com",
    databaseURL: "https://universidad-zubex-default-rtdb.firebaseio.com",
    projectId: "universidad-zubex",
    storageBucket: "universidad-zubex.firebasestorage.app",
    messagingSenderId: "827526548281",
    appId: "1:827526548281:web:f48223eadd0bfaf0f1b6e8"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  // ======= CATEGORÍAS FIJAS DE LA PLATAFORMA =======
  const CATEGORIAS = ["Institucionales", "Extrusión", "Impresión", "Conversión", "Corrugado"];

  const app = document.getElementById("app");
  const btnVolver = document.getElementById("btn-volver");

  // ======= ENRUTAMIENTO SIMPLE POR PARÁMETROS EN LA URL =======
  // Ejemplos de link:
  //   examenes.html                        -> menú de categorías
  //   examenes.html?categoria=Institucionales -> lista de exámenes de esa categoría
  //   examenes.html?examen=ABC123          -> abre directo ese examen (para compartir)
  function leerParametros() {
    return new URLSearchParams(window.location.search);
  }

  function irA(params) {
    const qs = new URLSearchParams(params).toString();
    window.location.search = qs ? "?" + qs : "";
  }

  btnVolver.addEventListener("click", () => irA({}));

  async function iniciar() {
    const params = leerParametros();
    const examenId = params.get("examen");
    const categoria = params.get("categoria");

    if (examenId) {
      btnVolver.style.display = "inline-block";
      mostrarExamen(examenId);
    } else if (categoria) {
      btnVolver.style.display = "inline-block";
      mostrarListaExamenes(categoria);
    } else {
      btnVolver.style.display = "none";
      mostrarMenuCategorias();
    }
  }

  // ======= VISTA 1: MENÚ DE CATEGORÍAS =======
  async function mostrarMenuCategorias() {
    app.innerHTML = `
      <h1>Elige una categoría</h1>
      <p class="subtitle">Selecciona el área para ver los exámenes disponibles.</p>
      <div class="grid" id="grid-categorias"></div>
    `;
    const grid = document.getElementById("grid-categorias");

    for (const cat of CATEGORIAS) {
      const snapshot = await db.collection("examenes")
        .where("categoria", "==", cat)
        .where("activo", "==", true)
        .get();

      const div = document.createElement("div");
      div.className = "cat-card";
      div.innerHTML = `
        <div class="nombre">${cat}</div>
        <div class="conteo">${snapshot.size} examen${snapshot.size === 1 ? "" : "es"} disponible${snapshot.size === 1 ? "" : "s"}</div>
      `;
      div.addEventListener("click", () => irA({ categoria: cat }));
      grid.appendChild(div);
    }
  }

  // ======= VISTA 2: LISTA DE EXÁMENES DE UNA CATEGORÍA =======
  async function mostrarListaExamenes(categoria) {
    app.innerHTML = `
      <h1>${categoria}</h1>
      <p class="subtitle">Exámenes disponibles en esta categoría.</p>
      <div class="grid" id="grid-examenes"></div>
    `;
    const grid = document.getElementById("grid-examenes");

    const snapshot = await db.collection("examenes")
      .where("categoria", "==", categoria)
      .where("activo", "==", true)
      .get();

    if (snapshot.empty) {
      grid.innerHTML = `<div class="vacio">Todavía no hay exámenes activos en esta categoría.</div>`;
      return;
    }

    snapshot.forEach(doc => {
      const data = doc.data();
      const div = document.createElement("div");
      div.className = "exam-card";
      div.innerHTML = `
        <div class="nombre">${data.titulo}</div>
        <div class="meta">${data.preguntas.length} preguntas</div>
      `;
      div.addEventListener("click", () => irA({ examen: doc.id }));
      grid.appendChild(div);
    });
  }

  // ======= VISTA 3: PRESENTAR UN EXAMEN =======
  async function mostrarExamen(examenId) {
    app.innerHTML = `<div class="cargando">Cargando examen...</div>`;

    const docRef = await db.collection("examenes").doc(examenId).get();
    if (!docRef.exists) {
      app.innerHTML = `<div class="vacio">Este examen ya no está disponible.</div>`;
      return;
    }
    const examen = docRef.data();

    let preguntasHtml = "";
    examen.preguntas.forEach((p, i) => {
      let opcionesHtml = "";
      p.opciones.forEach((op, j) => {
        opcionesHtml += `
          <label>
            <input type="radio" name="pregunta-${i}" value="${j}">
            ${op}
          </label>
        `;
      });
      preguntasHtml += `
        <div class="pregunta-bloque">
          <div class="pregunta-texto">${i + 1}. ${p.texto}</div>
          <div class="opciones">${opcionesHtml}</div>
        </div>
      `;
    });

    app.innerHTML = `
      <h1>${examen.titulo}</h1>
      <p class="subtitle">${examen.categoria} · ${examen.preguntas.length} preguntas</p>
      <div class="card">
        <label for="input-nombre">Nombre completo</label>
        <input type="text" id="input-nombre" placeholder="Ej. Juan Pérez">

        <label for="input-nomina">Número de nómina</label>
        <input type="text" id="input-nomina" placeholder="Ej. 10234">

        ${preguntasHtml}

        <div class="error-msg" id="error-msg" style="display:none;"></div>
        <button class="primario" id="btn-enviar">Enviar examen</button>
      </div>
    `;

    document.getElementById("btn-enviar").addEventListener("click", async () => {
      const btn = document.getElementById("btn-enviar");
      const errorMsg = document.getElementById("error-msg");
      const nombre = document.getElementById("input-nombre").value.trim();
      const nomina = document.getElementById("input-nomina").value.trim();

      // Validamos que todo esté contestado antes de calificar
      const respuestas = [];
      let faltantes = !nombre || !nomina;
      for (let i = 0; i < examen.preguntas.length; i++) {
        const seleccion = document.querySelector(`input[name="pregunta-${i}"]:checked`);
        if (!seleccion) faltantes = true;
        respuestas.push(seleccion ? parseInt(seleccion.value) : null);
      }

      if (faltantes) {
        errorMsg.style.display = "block";
        errorMsg.textContent = "Completa tu nombre, número de nómina y todas las preguntas antes de enviar.";
        return;
      }
      errorMsg.style.display = "none";
      btn.disabled = true;
      btn.textContent = "Enviando...";

      // Calificamos en el navegador solo para mostrar el resultado en pantalla.
      // Las respuestas correctas nunca se muestran al operador.
      let correctas = 0;
      examen.preguntas.forEach((p, i) => {
        if (respuestas[i] === p.respuestaCorrecta) correctas++;
      });
      const total = examen.preguntas.length;
      const porcentaje = Math.round((correctas / total) * 100);
      const umbral = examen.umbralAprobacion || 80;
      const aprobado = porcentaje >= umbral;

      try {
        await db.collection("resultados").add({
          examenId: examenId,
          examenTitulo: examen.titulo,
          categoria: examen.categoria,
          nombre: nombre,
          numeroNomina: nomina,
          puntaje: correctas,
          totalPreguntas: total,
          porcentaje: porcentaje,
          aprobado: aprobado,
          fecha: firebase.firestore.FieldValue.serverTimestamp()
        });
        mostrarResultado(examen, correctas, total, porcentaje, aprobado, examenId);
      } catch (error) {
        errorMsg.style.display = "block";
        errorMsg.textContent = "Hubo un error al guardar tu examen: " + error.message;
        btn.disabled = false;
        btn.textContent = "Enviar examen";
      }
    });
  }

  // ======= VISTA 4: RESULTADO (sin mostrar respuestas correctas) =======
  function mostrarResultado(examen, correctas, total, porcentaje, aprobado, examenId) {
    app.innerHTML = `
      <div class="card resultado">
        <div class="estado ${aprobado ? "aprobado" : "reprobado"}">
          ${aprobado ? "Examen aprobado" : "Examen no aprobado"}
        </div>
        <div class="puntaje ${aprobado ? "aprobado" : "reprobado"}">${porcentaje}%</div>
        <p class="detalle">${correctas} de ${total} preguntas correctas</p>
        ${aprobado
          ? `<p class="detalle">¡Bien hecho! Tu resultado ha sido registrado.</p>`
          : `<p class="detalle">No alcanzaste el mínimo requerido. Vuelve a presentar el examen cuando estés listo.</p>
             <button class="primario" onclick="location.href='?examen=${examenId}'">Volver a intentar</button>`
        }
      </div>
    `;
  }

  iniciar();
</script>
</body>
</html>
